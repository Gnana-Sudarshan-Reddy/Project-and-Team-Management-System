services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pm_user
      POSTGRES_PASSWORD: pm_pass
      POSTGRES_DB: pm_db
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pm_user -d pm_db"]
      interval: 5s
      retries: 10
  api:
    build: .
    env_file: .env.example
    environment:
      DATABASE_URL: postgresql+psycopg2://pm_user:pm_pass@db:5432/pm_db
      LOG_FILE: ""
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
volumes:
  pgdata:
